<script type="text/plain" id="gs-code">

// Philipp's Creator Hub - YouTube-Abholer
// Liest nur deine eigenen YouTube-Zahlen und schreibt sie in das Blatt "Verlauf". Aendert nichts bei YouTube.
var SHEET = "Verlauf";

function syncYouTube() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(SHEET) || ss.insertSheet(SHEET);
  var tz = Session.getScriptTimeZone();
  var today = Utilities.formatDate(new Date(), tz, "yyyy-MM-dd");

  var ch = YouTube.Channels.list("contentDetails,statistics", {mine: true}).items[0];
  var uploads = ch.contentDetails.relatedPlaylists.uploads;
  var ids = [];
  var token;
  do {
    var r = YouTube.PlaylistItems.list("contentDetails", {playlistId: uploads, maxResults: 50, pageToken: token});
    r.items.forEach(function (i) { ids.push(i.contentDetails.videoId); });
    token = r.nextPageToken;
  } while (token);

  var rows = [];
  for (var i = 0; i < ids.length; i += 50) {
    var v = YouTube.Videos.list("snippet,statistics", {id: ids.slice(i, i + 50).join(",")});
    v.items.forEach(function (x) {
      var s = x.statistics || {};
      rows.push([today, x.id, x.snippet.title, (x.snippet.publishedAt || "").slice(0, 10),
        Number(s.viewCount || 0), Number(s.likeCount || 0), Number(s.commentCount || 0)]);
    });
  }
  if (!ch.statistics.hiddenSubscriberCount) {
    rows.push([today, "KONTO", "Abonnenten", "", Number(ch.statistics.subscriberCount || 0), 0, 0]);
  }

  var head = ["Datum", "Video-ID", "Titel", "Veroeffentlicht", "Aufrufe", "Likes", "Kommentare"];
  var old = sh.getDataRange().getValues();
  var keep = [];
  for (var k = 1; k < old.length; k++) {
    var d = old[k][0] instanceof Date ? Utilities.formatDate(old[k][0], tz, "yyyy-MM-dd") : String(old[k][0]);
    if (d && d !== today) {
      var row = old[k].slice(0, 7);
      row[0] = d;
      keep.push(row);
    }
  }
  var all = [head].concat(keep, rows);
  sh.clearContents();
  sh.getRange(1, 1, all.length, 4).setNumberFormat("@");
  sh.getRange(1, 1, all.length, 7).setValues(all);
  sh.setFrozenRows(1);
  try { kanalVerlauf(false); } catch (e) { Logger.log("Kanalverlauf: " + e); }
}

// Holt den Tagesverlauf des ganzen Kanals seit Kanalstart (YouTube Analytics) in das Blatt "Kanalverlauf".
// Laeuft hoechstens einmal pro Tag (Analytics-Daten sind ohnehin 1-2 Tage verzoegert).
function kanalVerlauf(force) {
  var tz = Session.getScriptTimeZone();
  var props = PropertiesService.getScriptProperties();
  var heute = Utilities.formatDate(new Date(), tz, "yyyy-MM-dd");
  if (!force && props.getProperty("kanal") === heute) return;
  var gestern = Utilities.formatDate(new Date(Date.now() - 864e5), tz, "yyyy-MM-dd");
  var ch = YouTube.Channels.list("snippet", {mine: true}).items[0];
  var start = String(ch.snippet.publishedAt || "2015-01-01").slice(0, 10);
  if (start > gestern) start = gestern;
  var res = YouTubeAnalytics.Reports.query({
    ids: "channel==MINE", startDate: start, endDate: gestern,
    metrics: "views,subscribersGained,subscribersLost", dimensions: "day", sort: "day"
  });
  var rows = [["Datum", "Aufrufe", "AbonnentenPlus", "AbonnentenMinus"]];
  (res.rows || []).forEach(function (r) {
    rows.push([String(r[0]), Number(r[1]), Number(r[2]), Number(r[3])]);
  });
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("Kanalverlauf") || ss.insertSheet("Kanalverlauf");
  sh.clearContents();
  sh.getRange(1, 1, rows.length, 1).setNumberFormat("@");
  sh.getRange(1, 1, rows.length, 4).setValues(rows);
  sh.setFrozenRows(1);
  props.setProperty("kanal", heute);
}

// Einmal ausfuehren: legt den Lauf alle 15 Minuten an (YouTube und Instagram gleich) und holt sofort die ersten Zahlen
// (inklusive des Kanalverlaufs seit Kanalstart). Instagram und TikTok laufen nur, sobald ihre Schluessel hinterlegt sind.
function einrichten() {
  ScriptApp.getProjectTriggers().forEach(function (t) {
    var f = t.getHandlerFunction();
    if (f === "syncYouTube" || f === "syncInstagram" || f === "syncTikTok") ScriptApp.deleteTrigger(t);
  });
  ScriptApp.newTrigger("syncYouTube").timeBased().everyMinutes(15).create();
  ScriptApp.newTrigger("syncInstagram").timeBased().everyMinutes(15).create();
  if (PropertiesService.getScriptProperties().getProperty("TIKTOK_REFRESH_TOKEN")) {
    ScriptApp.newTrigger("syncTikTok").timeBased().everyMinutes(15).create();
  }
  syncYouTube();
  kanalVerlauf(false);
  try { syncInstagram(); } catch (e) { Logger.log("Instagram: " + e); }
  try { syncTikTok(); } catch (e) { Logger.log("TikTok: " + e); }
}

// ---------- Instagram (optional) ----------
// Liest nur deine eigenen Instagram-Zahlen (Aufrufe pro Reel/Beitrag, Follower) und schreibt sie in das Blatt "Instagram".
// Der Zugangsschluessel (Token IG_TOKEN) und die Konto-Nummer (IG_USER_ID) stehen nur in den Skripteigenschaften (Projekteinstellungen), nie im Code und nie im Hub.
function syncInstagram() {
  var props = PropertiesService.getScriptProperties();
  var token = props.getProperty("IG_TOKEN");
  if (!token) return;
  var tz = Session.getScriptTimeZone();
  var heute = Utilities.formatDate(new Date(), tz, "yyyy-MM-dd");
  var uid = props.getProperty("IG_USER_ID");
  if (!uid) throw new Error("IG_USER_ID fehlt in den Skripteigenschaften");
  var base = "https://graph.facebook.com/v22.0/";
  var me = igGet(base + uid + "?fields=username,followers_count&access_token=" + token);

  var media = [];
  var url = base + uid + "/media?fields=id,caption,permalink,timestamp,media_type,like_count,comments_count&limit=100&access_token=" + token;
  while (url) {
    var j = igGet(url);
    media = media.concat(j.data || []);
    url = (j.paging && j.paging.next) || "";
  }
  media = media.filter(function (m) { return m.media_type !== "CAROUSEL_ALBUM"; });

  // Neue Beitraege (letzte 14 Tage) bei jedem Lauf, alle anderen einmal pro Tag.
  var voll = props.getProperty("igVoll") !== heute;
  var grenze = Date.now() - 14 * 864e5;
  var dran = media.filter(function (m) { return voll || new Date(m.timestamp).getTime() >= grenze; });

  var rows = [];
  // Meta-Sammelabfrage: 50 Beitraege pro Aufruf (Apps Script erlaubt bei Meta nur wenige Einzelaufrufe pro Sekunde).
  for (var i = 0; i < dran.length; i += 50) {
    var teil = dran.slice(i, i + 50);
    if (i > 0) Utilities.sleep(1500);
    var res = igBatch(base, token, teil.map(function (m) { return m.id; }), "views,shares");
    var fehlt = [];
    res.forEach(function (x, idx) { if (!x) fehlt.push(idx); });
    if (fehlt.length) {
      Utilities.sleep(1500);
      var res2 = igBatch(base, token, fehlt.map(function (idx) { return teil[idx].id; }), "views");
      fehlt.forEach(function (idx, n) { res[idx] = res2[n]; });
    }
    for (var k = 0; k < teil.length; k++) {
      var m = teil[k];
      var data = res[k];
      if (!data || data.views == null) continue;
      rows.push([heute, String(m.id), String(m.caption || "").replace(/\s+/g, " ").trim() || ("Beitrag " + m.id),
        Utilities.formatDate(new Date(m.timestamp), tz, "yyyy-MM-dd"), Number(data.views),
        Number(m.like_count || 0), Number(m.comments_count || 0), Number(data.shares || 0), String(m.permalink || "")]);
    }
  }
  if (typeof me.followers_count === "number") {
    rows.push([heute, "KONTO", "Follower", "", me.followers_count, 0, 0, 0, ""]);
  }
  if (!rows.length) throw new Error("Instagram lieferte keine Daten");

  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("Instagram") || ss.insertSheet("Instagram");
  var neu = {};
  rows.forEach(function (r) { neu[r[1]] = true; });
  var alt = sh.getDataRange().getValues();
  var grenzTag = Utilities.formatDate(new Date(Date.now() - 60 * 864e5), tz, "yyyy-MM-dd");
  var keep = [];
  for (var q = 1; q < alt.length; q++) {
    var d = alt[q][0] instanceof Date ? Utilities.formatDate(alt[q][0], tz, "yyyy-MM-dd") : String(alt[q][0]);
    if (!d || d < grenzTag) continue;
    if (d === heute && neu[String(alt[q][1])]) continue;
    var row = alt[q].slice(0, 9);
    row[0] = d;
    row[1] = String(row[1]);
    keep.push(row);
  }
  var head = ["Datum", "Post-ID", "Titel", "Veroeffentlicht", "Aufrufe", "Likes", "Kommentare", "Shares", "Link"];
  var all = [head].concat(keep, rows);
  sh.clearContents();
  sh.getRange(1, 1, all.length, 4).setNumberFormat("@");
  sh.getRange(1, 9, all.length, 1).setNumberFormat("@");
  sh.getRange(1, 1, all.length, 9).setValues(all);
  sh.setFrozenRows(1);
  if (voll) props.setProperty("igVoll", heute);
  try { igVerlauf(false); } catch (e) { Logger.log("Instagram-Verlauf: " + e); }
  try { igFollowerVerlauf(false); } catch (e) { Logger.log("Instagram-Follower: " + e); }
}

function igGet(url) {
  var r = UrlFetchApp.fetch(url, {muteHttpExceptions: true});
  var j = {};
  try { j = JSON.parse(r.getContentText()); } catch (e) {}
  if (r.getResponseCode() !== 200) {
    throw new Error("Instagram: " + ((j.error && j.error.message) || ("Fehler " + r.getResponseCode())));
  }
  return j;
}

// Eine Sammelabfrage an Meta: gibt pro Beitrag {views, shares} zurueck oder null, wenn Meta fuer diesen Beitrag nichts liefert.
function igBatch(base, token, ids, metric) {
  var batch = ids.map(function (id) { return {method: "GET", relative_url: id + "/insights?metric=" + metric}; });
  var r = UrlFetchApp.fetch(base, {method: "post", payload: {access_token: token, batch: JSON.stringify(batch)}, muteHttpExceptions: true});
  var j = [];
  try { j = JSON.parse(r.getContentText()); } catch (e) {}
  if (r.getResponseCode() !== 200 || !Array.isArray(j)) {
    throw new Error("Instagram: " + ((j && j.error && j.error.message) || ("Fehler " + r.getResponseCode())));
  }
  return ids.map(function (id, n) {
    var x = j[n];
    if (!x || x.code !== 200) return null;
    var out = {};
    try {
      (JSON.parse(x.body).data || []).forEach(function (d) {
        var v = d.values && d.values[0] ? d.values[0].value : (d.total_value ? d.total_value.value : null);
        if (v != null) out[d.name] = v;
      });
    } catch (e) { return null; }
    return out;
  });
}

// ---------- TikTok (optional) ----------
// Liest nur deine eigenen TikTok-Zahlen (Aufrufe pro Video, Follower) ueber die offizielle TikTok-API und schreibt sie in das Blatt "TikTok".
// Schluessel stehen nur in den Skripteigenschaften: TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET, TIKTOK_REFRESH_TOKEN. Nie im Code und nie im Hub.
var TT_API = "https://open.tiktokapis.com/v2/";

// Einmal ausfuehren, nachdem TIKTOK_CODE (aus der TikTok-Freigabe) in den Skripteigenschaften steht.
// Tauscht den Code gegen den Dauer-Schluessel (TIKTOK_REFRESH_TOKEN), legt den 15-Minuten-Lauf an und holt die ersten Zahlen.
function tiktokLogin() {
  var props = PropertiesService.getScriptProperties();
  var code = props.getProperty("TIKTOK_CODE");
  if (!code) throw new Error("TIKTOK_CODE fehlt in den Skripteigenschaften");
  var j = ttToken({
    client_key: props.getProperty("TIKTOK_CLIENT_KEY"), client_secret: props.getProperty("TIKTOK_CLIENT_SECRET"),
    code: code, grant_type: "authorization_code", redirect_uri: "https://www.example.com/callback"
  });
  props.setProperty("TIKTOK_REFRESH_TOKEN", j.refresh_token);
  props.deleteProperty("TIKTOK_CODE");
  Logger.log("TikTok verbunden. Freigaben: " + j.scope);
  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (t.getHandlerFunction() === "syncTikTok") ScriptApp.deleteTrigger(t);
  });
  ScriptApp.newTrigger("syncTikTok").timeBased().everyMinutes(15).create();
  syncTikTok();
}

function ttToken(form) {
  var r = UrlFetchApp.fetch(TT_API + "oauth/token/", {method: "post", payload: form, muteHttpExceptions: true});
  var j = {};
  try { j = JSON.parse(r.getContentText()); } catch (e) {}
  if (r.getResponseCode() !== 200 || !j.access_token) {
    throw new Error("TikTok: " + (j.error_description || j.error || ("Fehler " + r.getResponseCode())));
  }
  return j;
}

function ttGet(path, token, body) {
  var opt = {method: body ? "post" : "get", headers: {Authorization: "Bearer " + token}, muteHttpExceptions: true};
  if (body) { opt.contentType = "application/json"; opt.payload = JSON.stringify(body); }
  var r = UrlFetchApp.fetch(TT_API + path, opt);
  var j = {};
  try { j = JSON.parse(r.getContentText()); } catch (e) {}
  if (r.getResponseCode() !== 200 || (j.error && j.error.code && j.error.code !== "ok")) {
    throw new Error("TikTok: " + ((j.error && j.error.message) || ("Fehler " + r.getResponseCode())));
  }
  return j.data || {};
}

function syncTikTok() {
  var props = PropertiesService.getScriptProperties();
  if (!props.getProperty("TIKTOK_REFRESH_TOKEN")) return;
  var tz = Session.getScriptTimeZone();
  var heute = Utilities.formatDate(new Date(), tz, "yyyy-MM-dd");
  var t = ttToken({
    client_key: props.getProperty("TIKTOK_CLIENT_KEY"), client_secret: props.getProperty("TIKTOK_CLIENT_SECRET"),
    grant_type: "refresh_token", refresh_token: props.getProperty("TIKTOK_REFRESH_TOKEN")
  });
  if (t.refresh_token) props.setProperty("TIKTOK_REFRESH_TOKEN", t.refresh_token);
  var token = t.access_token;

  var me = ttGet("user/info/?fields=open_id,display_name,follower_count", token).user || {};
  var rows = [];
  var cursor = 0;
  var fields = "id,create_time,share_url,video_description,title,view_count,like_count,comment_count,share_count";
  for (var seite = 0; seite < 50; seite++) {
    var d = ttGet("video/list/?fields=" + fields, token, {max_count: 20, cursor: cursor});
    (d.videos || []).forEach(function (v) {
      if (v.view_count == null) return;
      var titel = String(v.title || v.video_description || "").replace(/\s+/g, " ").trim() || ("Video " + v.id);
      rows.push([heute, String(v.id), titel, Utilities.formatDate(new Date(Number(v.create_time) * 1000), tz, "yyyy-MM-dd"),
        Number(v.view_count), Number(v.like_count || 0), Number(v.comment_count || 0), Number(v.share_count || 0), String(v.share_url || "")]);
    });
    if (!d.has_more) break;
    cursor = d.cursor;
    Utilities.sleep(300);
  }
  if (typeof me.follower_count === "number") {
    rows.push([heute, "KONTO", "Follower", "", me.follower_count, 0, 0, 0, ""]);
  }
  if (!rows.length) throw new Error("TikTok lieferte keine Daten");

  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("TikTok") || ss.insertSheet("TikTok");
  var neu = {};
  rows.forEach(function (r) { neu[r[1]] = true; });
  var alt = sh.getDataRange().getValues();
  var grenzTag = Utilities.formatDate(new Date(Date.now() - 60 * 864e5), tz, "yyyy-MM-dd");
  var keep = [];
  for (var q = 1; q < alt.length; q++) {
    var dd = alt[q][0] instanceof Date ? Utilities.formatDate(alt[q][0], tz, "yyyy-MM-dd") : String(alt[q][0]);
    if (!dd || dd < grenzTag) continue;
    if (dd === heute && neu[String(alt[q][1])]) continue;
    var row = alt[q].slice(0, 9);
    row[0] = dd;
    row[1] = String(row[1]);
    keep.push(row);
  }
  var head = ["Datum", "Post-ID", "Titel", "Veroeffentlicht", "Aufrufe", "Likes", "Kommentare", "Shares", "Link"];
  var all = [head].concat(keep, rows);
  sh.clearContents();
  sh.getRange(1, 1, all.length, 4).setNumberFormat("@");
  sh.getRange(1, 9, all.length, 1).setNumberFormat("@");
  sh.getRange(1, 1, all.length, 9).setValues(all);
  sh.setFrozenRows(1);
}

// Holt den Tagesverlauf des ganzen Instagram-Kontos (Aufrufe und Reichweite pro Tag) in das Blatt "Instagram-Verlauf".
// Beim ersten Mal ab Kontostart (Instagram liefert bis zu 2 Jahre zurueck), danach einmal pro Tag nur die letzten Tage.
// Die Tage zaehlen nach Instagram-Zeit (Pazifik). Follower-Verlauf liefert Instagram nicht rueckwirkend.
function igVerlauf(force) {
  var props = PropertiesService.getScriptProperties();
  var token = props.getProperty("IG_TOKEN"), uid = props.getProperty("IG_USER_ID");
  if (!token || !uid) return;
  var tz = Session.getScriptTimeZone();
  var heute = Utilities.formatDate(new Date(), tz, "yyyy-MM-dd");
  if (!force && props.getProperty("igVerlaufTag") === heute) return;
  var D = 864e5, nowMs = Date.now();
  var base = "https://graph.facebook.com/v22.0/" + uid + "/insights?access_token=" + token;
  function utcTag(ms) { return Utilities.formatDate(new Date(ms), "UTC", "yyyy-MM-dd"); }
  function tagMs(tag) { return Date.parse(tag + "T08:00:00Z"); }
  function holeAlle(urls) {
    var out = [];
    for (var i = 0; i < urls.length; i += 4) {
      var reqs = urls.slice(i, i + 4).map(function (u) { return { url: u, muteHttpExceptions: true }; });
      var antw;
      try { antw = UrlFetchApp.fetchAll(reqs); }
      catch (e) { Utilities.sleep(8000); antw = UrlFetchApp.fetchAll(reqs); }
      antw.forEach(function (r) { out.push(JSON.parse(r.getContentText())); });
      Utilities.sleep(1200);
    }
    return out;
  }
  function reichweite(vonMs, bisMs) {
    var urls = [];
    for (var s = vonMs; s < bisMs; s += 28 * D) {
      urls.push(base + "&metric=reach&period=day&since=" + Math.floor(s / 1000) + "&until=" + Math.floor(Math.min(s + 28 * D, bisMs) / 1000));
    }
    var m = {};
    holeAlle(urls).forEach(function (j) {
      if (j.error) throw new Error("Instagram: " + j.error.message);
      var d = j.data && j.data[0];
      ((d && d.values) || []).forEach(function (v) {
        m[utcTag(Date.parse(String(v.end_time).replace(/\+0000$/, "Z")))] = Number(v.value) || 0;
      });
    });
    return m;
  }
  function aufrufe(tage) {
    var urls = tage.map(function (t) {
      var s = tagMs(t);
      return base + "&metric=views&metric_type=total_value&period=day&since=" + Math.floor(s / 1000) + "&until=" + (Math.floor((s + D) / 1000) - 1);
    });
    var m = {};
    holeAlle(urls).forEach(function (j, i) {
      if (j.error) throw new Error("Instagram: " + j.error.message);
      var d = j.data && j.data[0];
      m[tage[i]] = Number(d && d.total_value ? d.total_value.value : 0) || 0;
    });
    return m;
  }
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("Instagram-Verlauf") || ss.insertSheet("Instagram-Verlauf");
  var have = {};
  if (sh.getLastRow() > 1) {
    sh.getRange(2, 1, sh.getLastRow() - 1, 3).getValues().forEach(function (r) {
      var t = r[0] instanceof Date ? Utilities.formatDate(r[0], tz, "yyyy-MM-dd") : String(r[0]).slice(0, 10);
      if (t) have[t] = [Number(r[1]) || 0, Number(r[2]) || 0];
    });
  }
  var letzterTag = utcTag(nowMs - D - 8 * 36e5);
  var ersterTag;
  var reach;
  if (!Object.keys(have).length || force === "voll") {
    have = {};
    var from = nowMs - 700 * D;
    reach = reichweite(from, nowMs);
    var tage0 = Object.keys(reach).sort();
    ersterTag = null;
    for (var i = 0; i < tage0.length; i++) { if (reach[tage0[i]] > 0) { ersterTag = tage0[i]; break; } }
    if (!ersterTag) throw new Error("Keine Instagram-Konto-Daten gefunden");
  } else {
    var back = utcTag(nowMs - 6 * D);
    ersterTag = back;
    reach = reichweite(tagMs(back), nowMs);
  }
  var tage = [];
  for (var ms = tagMs(ersterTag); utcTag(ms) <= letzterTag; ms += D) tage.push(utcTag(ms));
  var views = aufrufe(tage);
  tage.forEach(function (t) { have[t] = [views[t] || 0, reach[t] || 0]; });
  var rows = [["Datum", "Aufrufe", "Reichweite"]];
  Object.keys(have).sort().forEach(function (t) { rows.push([t, have[t][0], have[t][1]]); });
  sh.clearContents();
  sh.getRange(1, 1, rows.length, 1).setNumberFormat("@");
  sh.getRange(1, 1, rows.length, 3).setValues(rows);
  sh.setFrozenRows(1);
  props.setProperty("igVerlaufTag", heute);
  Logger.log("Instagram-Verlauf: " + (rows.length - 1) + " Tage, ab " + rows[1][0]);
}

// Holt Follower-Zugang und -Abgang des ganzen Instagram-Kontos pro Tag (seit Kontostart) in das Blatt "Instagram-Follower".
// Daraus rechnet der Hub die Follower rueckwirkend aus der heutigen Zahl zurueck. Laeuft einmal pro Tag, danach nur die letzten Tage.
function igFollowerVerlauf(force) {
  var props = PropertiesService.getScriptProperties();
  var token = props.getProperty("IG_TOKEN"), uid = props.getProperty("IG_USER_ID");
  if (!token || !uid) return;
  var tz = Session.getScriptTimeZone();
  var heute = Utilities.formatDate(new Date(), tz, "yyyy-MM-dd");
  if (!force && props.getProperty("igFolTag") === heute) return;
  var D = 864e5, nowMs = Date.now();
  var base = "https://graph.facebook.com/v22.0/" + uid + "/insights?access_token=" + token;
  function utcTag(ms) { return Utilities.formatDate(new Date(ms), "UTC", "yyyy-MM-dd"); }
  function tagMs(tag) { return Date.parse(tag + "T08:00:00Z"); }
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("Instagram-Follower") || ss.insertSheet("Instagram-Follower");
  var have = {};
  if (sh.getLastRow() > 1) {
    sh.getRange(2, 1, sh.getLastRow() - 1, 3).getValues().forEach(function (r) {
      var t = r[0] instanceof Date ? Utilities.formatDate(r[0], tz, "yyyy-MM-dd") : String(r[0]).slice(0, 10);
      if (t) have[t] = [Number(r[1]) || 0, Number(r[2]) || 0];
    });
  }
  var ersterTag;
  if (!Object.keys(have).length || force === "voll") {
    have = {};
    var v = ss.getSheetByName("Instagram-Verlauf");
    if (!v || v.getLastRow() < 2) throw new Error("Blatt Instagram-Verlauf fehlt");
    var a = v.getRange(2, 1).getValue();
    ersterTag = a instanceof Date ? Utilities.formatDate(a, tz, "yyyy-MM-dd") : String(a).slice(0, 10);
  } else {
    ersterTag = utcTag(nowMs - 6 * D);
  }
  var letzterTag = utcTag(nowMs - D - 8 * 36e5);
  var tage = [];
  for (var ms = tagMs(ersterTag); utcTag(ms) <= letzterTag; ms += D) tage.push(utcTag(ms));
  for (var i = 0; i < tage.length; i += 4) {
    var teil = tage.slice(i, i + 4);
    var reqs = teil.map(function (t) {
      var s = tagMs(t);
      return { url: base + "&metric=follows_and_unfollows&metric_type=total_value&breakdown=follow_type&period=day&since=" + Math.floor(s / 1000) + "&until=" + (Math.floor((s + D) / 1000) - 1), muteHttpExceptions: true };
    });
    var antw;
    try { antw = UrlFetchApp.fetchAll(reqs); }
    catch (e) { Utilities.sleep(8000); antw = UrlFetchApp.fetchAll(reqs); }
    antw.forEach(function (r, k) {
      var j = JSON.parse(r.getContentText());
      if (j.error) throw new Error("Instagram: " + j.error.message);
      var zu = 0, ab = 0;
      var d = j.data && j.data[0];
      var res = (d && d.total_value && d.total_value.breakdowns && d.total_value.breakdowns[0] && d.total_value.breakdowns[0].results) || [];
      res.forEach(function (x) {
        if (x.dimension_values[0] === "FOLLOWER") zu = Number(x.value) || 0;
        else ab = Number(x.value) || 0;
      });
      have[teil[k]] = [zu, ab];
    });
    Utilities.sleep(1200);
  }
  var rows = [["Datum", "Zugang", "Abgang"]];
  Object.keys(have).sort().forEach(function (t) { rows.push([t, have[t][0], have[t][1]]); });
  sh.clearContents();
  sh.getRange(1, 1, rows.length, 1).setNumberFormat("@");
  sh.getRange(1, 1, rows.length, 3).setValues(rows);
  sh.setFrozenRows(1);
  props.setProperty("igFolTag", heute);
  Logger.log("Instagram-Follower: " + (rows.length - 1) + " Tage, ab " + rows[1][0]);
}

// Liest nur oeffentliche Kanal-Infos (live oder nicht, Titel, Spiel, Zuschauer, Sendeplan) ueber die offizielle Twitch-Schnittstelle
// und schreibt sie in das Blatt "Twitch". Schluessel stehen nur in den Skripteigenschaften:
// TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET und optional TWITCH_LOGIN (Kanalname, Standard: gtasty). Nie im Code und nie im Hub.
function twitchToken() {
  var cache = CacheService.getScriptCache();
  var t = cache.get("twitchToken");
  if (t) return t;
  var props = PropertiesService.getScriptProperties();
  var r = UrlFetchApp.fetch("https://id.twitch.tv/oauth2/token", {
    method: "post", muteHttpExceptions: true,
    payload: {client_id: props.getProperty("TWITCH_CLIENT_ID"), client_secret: props.getProperty("TWITCH_CLIENT_SECRET"), grant_type: "client_credentials"}
  });
  var j = {};
  try { j = JSON.parse(r.getContentText()); } catch (e) {}
  if (r.getResponseCode() !== 200 || !j.access_token) {
    throw new Error("Twitch: " + (j.message || ("Fehler " + r.getResponseCode())) + " (Client-ID und Geheimnis in den Skripteigenschaften pruefen)");
  }
  cache.put("twitchToken", j.access_token, Math.max(60, Math.min(21000, (j.expires_in || 3600) - 300)));
  return j.access_token;
}

function twGet(path) {
  var r = UrlFetchApp.fetch("https://api.twitch.tv/helix/" + path, {
    headers: {"Client-Id": PropertiesService.getScriptProperties().getProperty("TWITCH_CLIENT_ID"), Authorization: "Bearer " + twitchToken()},
    muteHttpExceptions: true
  });
  var j = {};
  try { j = JSON.parse(r.getContentText()); } catch (e) {}
  if (r.getResponseCode() === 401) { CacheService.getScriptCache().remove("twitchToken"); }
  if (r.getResponseCode() !== 200) throw new Error("Twitch: " + (j.message || ("Fehler " + r.getResponseCode())));
  return j;
}

function twDauer(s) {
  var m = /(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/.exec(s || "");
  return ((+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0)) * 1000;
}

function syncTwitch() {
  var props = PropertiesService.getScriptProperties();
  if (!props.getProperty("TWITCH_CLIENT_ID") || !props.getProperty("TWITCH_CLIENT_SECRET")) return;
  var login = String(props.getProperty("TWITCH_LOGIN") || "gtasty").trim().toLowerCase();
  var u = twGet("users?login=" + encodeURIComponent(login)).data || [];
  if (!u.length) throw new Error("Twitch: Kanal " + login + " nicht gefunden");
  var id = u[0].id, name = u[0].display_name || login;
  var st = twGet("streams?user_id=" + id).data || [];
  var live = st.length > 0 && st[0].type === "live";
  var info = live ? st[0] : {};
  var last = props.getProperty("twLastLive") || "";
  if (live) {
    last = new Date().toISOString();
    props.setProperty("twLastLive", last);
  } else {
    try {
      var v = twGet("videos?user_id=" + id + "&type=archive&first=1").data || [];
      if (v.length) {
        var ende = new Date(Date.parse(v[0].created_at) + twDauer(v[0].duration)).toISOString();
        if (ende > last) { last = ende; props.setProperty("twLastLive", last); }
      }
    } catch (e) { Logger.log("Twitch-Videos: " + e); }
  }
  var next = "", nextTitle = "";
  try {
    var sc = twGet("schedule?broadcaster_id=" + id + "&first=10").data || {};
    var seg = sc.segments || [];
    for (var i = 0; i < seg.length; i++) {
      if (!seg[i].canceled_until && Date.parse(seg[i].start_time) > Date.now()) { next = seg[i].start_time; nextTitle = seg[i].title || ""; break; }
    }
  } catch (e) { Logger.log("Twitch-Sendeplan: " + e); }
  var rows = [["Schluessel", "Wert"],
    ["login", login], ["name", name], ["live", live ? "ja" : "nein"],
    ["titel", String(info.title || "")], ["spiel", String(info.game_name || "")], ["zuschauer", String(info.viewer_count || 0)],
    ["gestartet", String(info.started_at || "")], ["zuletzt_live", last], ["naechster_start", next], ["naechster_titel", nextTitle],
    ["abgefragt", new Date().toISOString()]];
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("Twitch") || ss.insertSheet("Twitch");
  sh.clearContents();
  sh.getRange(1, 1, rows.length, 2).setNumberFormat("@");
  sh.getRange(1, 1, rows.length, 2).setValues(rows);
  sh.setFrozenRows(1);
}

// Einmal ausfuehren, nachdem TWITCH_CLIENT_ID und TWITCH_CLIENT_SECRET in den Skripteigenschaften stehen:
// legt den Lauf alle 5 Minuten an und holt sofort den ersten Status.
function twitchEinrichten() {
  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (t.getHandlerFunction() === "syncTwitch") ScriptApp.deleteTrigger(t);
  });
  ScriptApp.newTrigger("syncTwitch").timeBased().everyMinutes(5).create();
  syncTwitch();
}

// ---------- Abgleich zwischen Geraeten (optional) ----------
// Speichert deine handgemachten Eintraege (eingereicht, Betraege, Auszahlungen, eigene Clips, Einstellungen) in einer privaten Datei
// in deinem Google Drive, damit PC und Handy dieselben Daten haben. Der Sync-Code steht nur in den Skripteigenschaften (HUB_SYNC_CODE)
// und im Browser deiner Geraete, nie in diesem Code und nie in der Hub-Datei. Ohne richtigen Code gibt das Skript nichts heraus.
function hubDatei() {
  var props = PropertiesService.getScriptProperties();
  var id = props.getProperty("hubSyncDatei");
  if (id) { try { return DriveApp.getFileById(id); } catch (e) {} }
  var f = DriveApp.createFile("creator-hub-abgleich.json", "{}", "application/json");
  props.setProperty("hubSyncDatei", f.getId());

}

function doGet() {

}

function antwort(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var lock = LockService.getScriptLock();
  try {
    var req = JSON.parse(e.postData.contents);
    var code = PropertiesService.getScriptProperties().getProperty("HUB_SYNC_CODE");
    if (!code || String(req.code || "") !== code) {
      Utilities.sleep(2000);
      return antwort({ok: false, error: "Sync-Code falsch oder noch nicht in den Skripteigenschaften (HUB_SYNC_CODE) eingetragen"});
    }
    lock.waitLock(25000);
    var f = hubDatei();
    var st = {};
    try { st = JSON.parse(f.getBlob().getDataAsString() || "{}"); } catch (x) {}
    if (!st.items) st.items = {};
    var now = Date.now(), max = 0, k;
    if (req.action === "put") {
      var neu = req.items || {};
      for (k in neu) { st.items[k] = {r: neu[k].r === undefined ? null : neu[k].r, t: now}; }
      f.setContent(JSON.stringify(st));
    }
    var since = Number(req.since) || 0, out = {};
    for (k in st.items) {
      var t = st.items[k].t;
      if (t > max) max = t;
      if (req.action !== "put" && t > since) out[k] = st.items[k];
    }
    return antwort({ok: true, items: out, max: max});
  } catch (err) {
    return antwort({ok: false, error: String(err)});
  } finally {
    try { lock.releaseLock(); } catch (y) {}
  }
}
