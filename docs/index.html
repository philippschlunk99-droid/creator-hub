<script type="text/plain" id="gs-code">
// Philipp's Creator Hub - YouTube-Abholer
// Liest nur deine eigenen YouTube-Zahlen und schreibt sie in das Blatt "Verlauf". Aendert nichts bei YouTube.
var SHEET = "Verlauf";

// Veroeffentlichung als "2026-11-19 18:45" (Berlin). Der Hub braucht die Uhrzeit fuer den Upload-Planer.
function berlinZeit(wert) {
  var t = typeof wert === "number" ? wert : Date.parse(wert || "");
  if (!t || isNaN(t)) return "";
  return Utilities.formatDate(new Date(t), "Europe/Berlin", "yyyy-MM-dd HH:mm");
}

function syncYouTube() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(SHEET) || ss.insertSheet(SHEET);
  var tz = Session.getScriptTimeZone();
  var today = Utilities.formatDate(new Date(), tz, "yyyy-MM-dd");

  var ch = YouTube.Channels.list("contentDetails,statistics", {mine: true}).items[0];
  var uploads = ch.contentDetails.relatedPlaylists.uploads;
  var ids = [];
  var token;
  do {
    var r = YouTube.PlaylistItems.list("contentDetails", {playlistId: uploads, maxResults: 50, pageToken: token});
    r.items.forEach(function (i) { ids.push(i.contentDetails.videoId); });
    token = r.nextPageToken;
  } while (token);

  var rows = [];
  for (var i = 0; i < ids.length; i += 50) {
    var v = YouTube.Videos.list("snippet,statistics", {id: ids.slice(i, i + 50).join(",")});
    v.items.forEach(function (x) {
      var s = x.statistics || {};
      rows.push([today, x.id, x.snippet.title, berlinZeit(x.snippet.publishedAt),
        Number(s.viewCount || 0), Number(s.likeCount || 0), Number(s.commentCount || 0)]);
    });
  }
  if (!ch.statistics.hiddenSubscriberCount) {
    rows.push([today, "KONTO", "Abonnenten", "", Number(ch.statistics.subscriberCount || 0), 0, 0]);
  }

  var head = ["Datum", "Video-ID", "Titel", "Veroeffentlicht", "Aufrufe", "Likes", "Kommentare"];
  var old = sh.getDataRange().getValues();
  var keep = [];
  for (var k = 1; k < old.length; k++) {
    var d = old[k][0] instanceof Date ? Utilities.formatDate(old[k][0], tz, "yyyy-MM-dd") : String(old[k][0]);
    if (d && d !== today) {
      var row = old[k].slice(0, 7);
      row[0] = d;
      keep.push(row);
    }
  }
  var all = [head].concat(keep, rows);
  sh.clearContents();
  sh.getRange(1, 1, all.length, 4).setNumberFormat("@");
  sh.getRange(1, 1, all.length, 7).setValues(all);
  sh.setFrozenRows(1);
  try { kanalVerlauf(false); } catch (e) { Logger.log("Kanalverlauf: " + e); }
}

// Holt den Tagesverlauf des ganzen Kanals seit Kanalstart (YouTube Analytics) in das Blatt "Kanalverlauf".
// Laeuft hoechstens einmal pro Tag (Analytics-Daten sind ohnehin 1-2 Tage verzoegert).
function kanalVerlauf(force) {
  var tz = Session.getScriptTimeZone();
  var props = PropertiesService.getScriptProperties();
  var heute = Utilities.formatDate(new Date(), tz, "yyyy-MM-dd");
  if (!force && props.getProperty("kanal") === heute) return;
  var gestern = Utilities.formatDate(new Date(Date.now() - 864e5), tz, "yyyy-MM-dd");
  var ch = YouTube.Channels.list("snippet", {mine: true}).items[0];
  var start = String(ch.snippet.publishedAt || "2015-01-01").slice(0, 10);
  if (start > gestern) start = gestern;
  var res = YouTubeAnalytics.Reports.query({
    ids: "channel==MINE", startDate: start, endDate: gestern,
    metrics: "views,subscribersGained,subscribersLost", dimensions: "day", sort: "day"
  });
  var rows = [["Datum", "Aufrufe", "AbonnentenPlus", "AbonnentenMinus"]];
  (res.rows || []).forEach(function (r) {
    rows.push([String(r[0]), Number(r[1]), Number(r[2]), Number(r[3])]);
  });
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("Kanalverlauf") || ss.insertSheet("Kanalverlauf");
  sh.clearContents();
  sh.getRange(1, 1, rows.length, 1).setNumberFormat("@");
  sh.getRange(1, 1, rows.length, 4).setValues(rows);
  sh.setFrozenRows(1);
  props.setProperty("kanal", heute);
}

// Einmal ausfuehren: legt den Lauf alle 15 Minuten an (YouTube und Instagram gleich) und holt sofort die ersten Zahlen
// (inklusive des Kanalverlaufs seit Kanalstart). Instagram und TikTok laufen nur, sobald ihre Schluessel hinterlegt sind.
function einrichten() {
  ScriptApp.getProjectTriggers().forEach(function (t) {
    var f = t.getHandlerFunction();
    if (f === "syncYouTube" || f === "syncInstagram" || f === "syncTikTok") ScriptApp.deleteTrigger(t);
  });
  ScriptApp.newTrigger("syncYouTube").timeBased().everyMinutes(15).create();
  ScriptApp.newTrigger("syncInstagram").timeBased().everyMinutes(15).create();
  if (PropertiesService.getScriptProperties().getProperty("TIKTOK_REFRESH_TOKEN")) {
    ScriptApp.newTrigger("syncTikTok").timeBased().everyMinutes(15).create();
  }
  syncYouTube();
  kanalVerlauf(false);
  try { syncInstagram(); } catch (e) { Logger.log("Instagram: " + e); }
  try { syncTikTok(); } catch (e) { Logger.log("TikTok: " + e); }
}

// ---------- Instagram (optional) ----------
// Liest nur deine eigenen Instagram-Zahlen (Aufrufe pro Reel/Beitrag, Follower) und schreibt sie in das Blatt "Instagram".
// Der Zugangsschluessel (Token IG_TOKEN) und die Konto-Nummer (IG_USER_ID) stehen nur in den Skripteigenschaften (Projekteinstellungen), nie im Code und nie im Hub.
function syncInstagram() {
  var props = PropertiesService.getScriptProperties();
  var token = props.getProperty("IG_TOKEN");
  if (!token) return;
  var tz = Session.getScriptTimeZone();
  var heute = Utilities.formatDate(new Date(), tz, "yyyy-MM-dd");
  var uid = props.getProperty("IG_USER_ID");
  if (!uid) throw new Error("IG_USER_ID fehlt in den Skripteigenschaften");
  var base = "https://graph.facebook.com/v22.0/";
  var me = igGet(base + uid + "?fields=username,followers_count&access_token=" + token);

  var media = [];
  var url = base + uid + "/media?fields=id,caption,permalink,timestamp,media_type,like_count,comments_count&limit=100&access_token=" + token;
  while (url) {
    var j = igGet(url);
    media = media.concat(j.data || []);
    url = (j.paging && j.paging.next) || "";
  }
  media = media.filter(function (m) { return m.media_type !== "CAROUSEL_ALBUM"; });

  // Neue Beitraege (letzte 14 Tage) bei jedem Lauf, alle anderen einmal pro Tag.
  var voll = props.getProperty("igVoll") !== heute;
  var grenze = Date.now() - 14 * 864e5;
  var dran = media.filter(function (m) { return voll || new Date(m.timestamp).getTime() >= grenze; });

  var rows = [];
  // Meta-Sammelabfrage: 50 Beitraege pro Aufruf (Apps Script erlaubt bei Meta nur wenige Einzelaufrufe pro Sekunde).
  for (var i = 0; i < dran.length; i += 50) {
    var teil = dran.slice(i, i + 50);
    if (i > 0) Utilities.sleep(1500);
    var res = igBatch(base, token, teil.map(function (m) { return m.id; }), "views,shares");
    var fehlt = [];
    res.forEach(function (x, idx) { if (!x) fehlt.push(idx); });
    if (fehlt.length) {
      Utilities.sleep(1500);
      var res2 = igBatch(base, token, fehlt.map(function (idx) { return teil[idx].id; }), "views");
      fehlt.forEach(function (idx, n) { res[idx] = res2[n]; });
    }
    for (var k = 0; k < teil.length; k++) {
      var m = teil[k];
      var data = res[k];
      if (!data || data.views == null) continue;
      rows.push([heute, String(m.id), String(m.caption || "").replace(/\s+/g, " ").trim() || ("Beitrag " + m.id),
        berlinZeit(m.timestamp), Number(data.views),
        Number(m.like_count || 0), Number(m.comments_count || 0), Number(data.shares || 0), String(m.permalink || "")]);
    }
  }
  if (typeof me.followers_count === "number") {
    rows.push([heute, "KONTO", "Follower", "", me.followers_count, 0, 0, 0, ""]);
  }
  if (!rows.length) throw new Error("Instagram lieferte keine Daten");

  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("Instagram") || ss.insertSheet("Instagram");
  var neu = {};
  rows.forEach(function (r) { neu[r[1]] = true; });
  var alt = sh.getDataRange().getValues();
  var grenzTag = Utilities.formatDate(new Date(Date.now() - 60 * 864e5), tz, "yyyy-MM-dd");
  var keep = [];
  for (var q = 1; q < alt.length; q++) {
    var d = alt[q][0] instanceof Date ? Utilities.formatDate(alt[q][0], tz, "yyyy-MM-dd") : String(alt[q][0]);
    if (!d || d < grenzTag) continue;
    if (d === heute && neu[String(alt[q][1])]) continue;
    var row = alt[q].slice(0, 9);
    row[0] = d;
    row[1] = String(row[1]);
    keep.push(row);
  }
  var head = ["Datum", "Post-ID", "Titel", "Veroeffentlicht", "Aufrufe", "Likes", "Kommentare", "Shares", "Link"];
  var all = [head].concat(keep, rows);
  sh.clearContents();
  sh.getRange(1, 1, all.length, 4).setNumberFormat("@");
  sh.getRange(1, 9, all.length, 1).setNumberFormat("@");
  sh.getRange(1, 1, all.length, 9).setValues(all);
  sh.setFrozenRows(1);
  if (voll) props.setProperty("igVoll", heute);
  try { igVerlauf(false); } catch (e) { Logger.log("Instagram-Verlauf: " + e); }
  try { igFollowerVerlauf(false); } catch (e) { Logger.log("Instagram-Follower: " + e); }
}

function igGet(url) {
  var r = UrlFetchApp.fetch(url, {muteHttpExceptions: true});
  var j = {};
  try { j = JSON.parse(r.getContentText()); } catch (e) {}
  if (r.getResponseCode() !== 200) {
    throw new Error("Instagram: " + ((j.error && j.error.message) || ("Fehler " + r.getResponseCode())));
  }
  return j;
}

// Eine Sammelabfrage an Meta: gibt pro Beitrag {views, shares} zurueck oder null, wenn Meta fuer diesen Beitrag nichts liefert.
function igBatch(base, token, ids, metric) {
  var batch = ids.map(function (id) { return {method: "GET", relative_url: id + "/insights?metric=" + metric}; });
  var r = UrlFetchApp.fetch(base, {method: "post", payload: {access_token: token, batch: JSON.stringify(batch)}, muteHttpExceptions: true});
  var j = [];
  try { j = JSON.parse(r.getContentText()); } catch (e) {}
  if (r.getResponseCode() !== 200 || !Array.isArray(j)) {
    throw new Error("Instagram: " + ((j && j.error && j.error.message) || ("Fehler " + r.getResponseCode())));
  }
  return ids.map(function (id, n) {
    var x = j[n];
    if (!x || x.code !== 200) return null;
    var out = {};
    try {
      (JSON.parse(x.body).data || []).forEach(function (d) {
        var v = d.values && d.values[0] ? d.values[0].value : (d.total_value ? d.total_value.value : null);
        if (v != null) out[d.name] = v;
      });
    } catch (e) { return null; }
    return out;
  });
}

// ---------- TikTok (optional) ----------
// Liest nur deine eigenen TikTok-Zahlen (Aufrufe pro Video, Follower) ueber die offizielle TikTok-API und schreibt sie in das Blatt "TikTok".
// Schluessel stehen nur in den Skripteigenschaften: TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET, TIKTOK_REFRESH_TOKEN. Nie im Code und nie im Hub.
var TT_API = "https://open.tiktokapis.com/v2/";

// Einmal ausfuehren, nachdem TIKTOK_CODE (aus der TikTok-Freigabe) in den Skripteigenschaften steht.
// Tauscht den Code gegen den Dauer-Schluessel (TIKTOK_REFRESH_TOKEN), legt den 15-Minuten-Lauf an und holt die ersten Zahlen.
function tiktokLogin() {
  var props = PropertiesService.getScriptProperties();
  var code = props.getProperty("TIKTOK_CODE");
  if (!code) throw new Error("TIKTOK_CODE fehlt in den Skripteigenschaften");
  var j = ttToken({
    client_key: props.getProperty("TIKTOK_CLIENT_KEY"), client_secret: props.getProperty("TIKTOK_CLIENT_SECRET"),
    code: code, grant_type: "authorization_code", redirect_uri: "https://www.example.com/callback"
  });
  props.setProperty("TIKTOK_REFRESH_TOKEN", j.refresh_token);
  props.deleteProperty("TIKTOK_CODE");
  Logger.log("TikTok verbunden. Freigaben: " + j.scope);
  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (t.getHandlerFunction() === "syncTikTok") ScriptApp.deleteTrigger(t);
  });
  ScriptApp.newTrigger("syncTikTok").timeBased().everyMinutes(15).create();
  syncTikTok();
}

function ttToken(form) {
  var r = UrlFetchApp.fetch(TT_API + "oauth/token/", {method: "post", payload: form, muteHttpExceptions: true});
  var j = {};
  try { j = JSON.parse(r.getContentText()); } catch (e) {}
  if (r.getResponseCode() !== 200 || !j.access_token) {
    throw new Error("TikTok: " + (j.error_description || j.error || ("Fehler " + r.getResponseCode())));
  }
  return j;
}

function ttGet(path, token, body) {
  var opt = {method: body ? "post" : "get", headers: {Authorization: "Bearer " + token}, muteHttpExceptions: true};
  if (body) { opt.contentType = "application/json"; opt.payload = JSON.stringify(body); }
  var r = UrlFetchApp.fetch(TT_API + path, opt);
  var j = {};
  try { j = JSON.parse(r.getContentText()); } catch (e) {}
  if (r.getResponseCode() !== 200 || (j.error && j.error.code && j.error.code !== "ok")) {
    throw new Error("TikTok: " + ((j.error && j.error.message) || ("Fehler " + r.getResponseCode())));
  }
  return j.data || {};
}

function syncTikTok() {
  var props = PropertiesService.getScriptProperties();
  if (!props.getProperty("TIKTOK_REFRESH_TOKEN")) return;
  var tz = Session.getScriptTimeZone();
  var heute = Utilities.formatDate(new Date(), tz, "yyyy-MM-dd");
  var t = ttToken({
    client_key: props.getProperty("TIKTOK_CLIENT_KEY"), client_secret: props.getProperty("TIKTOK_CLIENT_SECRET"),
    grant_type: "refresh_token", refresh_token: props.getProperty("TIKTOK_REFRESH_TOKEN")
  });
  if (t.refresh_token) props.setProperty("TIKTOK_REFRESH_TOKEN", t.refresh_token);
  var token = t.access_token;

  var me = ttGet("user/info/?fields=open_id,display_name,follower_count", token).user || {};
  var rows = [];
  var cursor = 0;
  var fields = "id,create_time,share_url,video_description,title,view_count,like_count,comment_count,share_count";
  for (var seite = 0; seite < 50; seite++) {
    var d = ttGet("video/list/?fields=" + fields, token, {max_count: 20, cursor: cursor});
    (d.videos || []).forEach(function (v) {
      if (v.view_count == null) return;
      var titel = String(v.title || v.video_description || "").replace(/\s+/g, " ").trim() || ("Video " + v.id);
      rows.push([heute, String(v.id), titel, berlinZeit(Number(v.create_time) * 1000),
        Number(v.view_count), Number(v.like_count || 0), Number(v.comment_count || 0), Number(v.share_count || 0), String(v.share_url || "")]);
    });
    if (!d.has_more) break;
    cursor = d.cursor;
    Utilities.sleep(300);
  }
  if (typeof me.follower_count === "number") {
    rows.push([heute, "KONTO", "Follower", "", me.follower_count, 0, 0, 0, ""]);
  }
  if (!rows.length) throw new Error("TikTok lieferte keine Daten");

  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("TikTok") || ss.insertSheet("TikTok");
  var neu = {};
  rows.forEach(function (r) { neu[r[1]] = true; });
  var alt = sh.getDataRange().getValues();
  var grenzTag = Utilities.formatDate(new Date(Date.now() - 60 * 864e5), tz, "yyyy-MM-dd");
  var keep = [];
  for (var q = 1; q < alt.length; q++) {
    var dd = alt[q][0] instanceof Date ? Utilities.formatDate(alt[q][0], tz, "yyyy-MM-dd") : String(alt[q][0]);
    if (!dd || dd < grenzTag) continue;
    if (dd === heute && neu[String(alt[q][1])]) continue;
    var row = alt[q].slice(0, 9);
    row[0] = dd;
    row[1] = String(row[1]);
    keep.push(row);
  }
  var head = ["Datum", "Post-ID", "Titel", "Veroeffentlicht", "Aufrufe", "Likes", "Kommentare", "Shares", "Link"];
  var all = [head].concat(keep, rows);
  sh.clearContents();
  sh.getRange(1, 1, all.length, 4).setNumberFormat("@");
  sh.getRange(1, 9, all.length, 1).setNumberFormat("@");
  sh.getRange(1, 1, all.length, 9).setValues(all);
  sh.setFrozenRows(1);
}

// Holt den Tagesverlauf des ganzen Instagram-Kontos (Aufrufe und Reichweite pro Tag) in das Blatt "Instagram-Verlauf".
// Beim ersten Mal ab Kontostart (Instagram liefert bis zu 2 Jahre zurueck), danach einmal pro Tag nur die letzten Tage.
// Die Tage zaehlen nach Instagram-Zeit (Pazifik). Follower-Verlauf liefert Instagram nicht rueckwirkend.
function igVerlauf(force) {
  var props = PropertiesService.getScriptProperties();
  var token = props.getProperty("IG_TOKEN"), uid = props.getProperty("IG_USER_ID");
  if (!token || !uid) return;
  var tz = Session.getScriptTimeZone();
  var heute = Utilities.formatDate(new Date(), tz, "yyyy-MM-dd");
  if (!force && props.getProperty("igVerlaufTag") === heute) return;
  var D = 864e5, nowMs = Date.now();
  var base = "https://graph.facebook.com/v22.0/" + uid + "/insights?access_token=" + token;
  function utcTag(ms) { return Utilities.formatDate(new Date(ms), "UTC", "yyyy-MM-dd"); }
  function tagMs(tag) { return Date.parse(tag + "T08:00:00Z"); }
  function holeAlle(urls) {
    var out = [];
    for (var i = 0; i < urls.length; i += 4) {
      var reqs = urls.slice(i, i + 4).map(function (u) { return { url: u, muteHttpExceptions: true }; });
      var antw;
      try { antw = UrlFetchApp.fetchAll(reqs); }
      catch (e) { Utilities.sleep(8000); antw = UrlFetchApp.fetchAll(reqs); }
      antw.forEach(function (r) { out.push(JSON.parse(r.getContentText())); });
      Utilities.sleep(1200);
    }
    return out;
  }
  function reichweite(vonMs, bisMs) {
    var urls = [];
    for (var s = vonMs; s < bisMs; s += 28 * D) {
      urls.push(base + "&metric=reach&period=day&since=" + Math.floor(s / 1000) + "&until=" + Math.floor(Math.min(s + 28 * D, bisMs) / 1000));
    }
    var m = {};
    holeAlle(urls).forEach(function (j) {
      if (j.error) throw new Error("Instagram: " + j.error.message);
      var d = j.data && j.data[0];
      ((d && d.values) || []).forEach(function (v) {
        m[utcTag(Date.parse(String(v.end_time).replace(/\+0000$/, "Z")))] = Number(v.value) || 0;
      });
    });
    return m;
  }
  function aufrufe(tage) {
    var urls = tage.map(function (t) {
      var s = tagMs(t);
      return base + "&metric=views&metric_type=total_value&period=day&since=" + Math.floor(s / 1000) + "&until=" + (Math.floor((s + D) / 1000) - 1);
    });
    var m = {};
    holeAlle(urls).forEach(function (j, i) {
      if (j.error) throw new Error("Instagram: " + j.error.message);
      var d = j.data && j.data[0];
      m[tage[i]] = Number(d && d.total_value ? d.total_value.value : 0) || 0;
    });
    return m;
  }
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("Instagram-Verlauf") || ss.insertSheet("Instagram-Verlauf");
  var have = {};
  if (sh.getLastRow() > 1) {
    sh.getRange(2, 1, sh.getLastRow() - 1, 3).getValues().forEach(function (r) {
      var t = r[0] instanceof Date ? Utilities.formatDate(r[0], tz, "yyyy-MM-dd") : String(r[0]).slice(0, 10);
      if (t) have[t] = [Number(r[1]) || 0, Number(r[2]) || 0];
    });
  }
  var letzterTag = utcTag(nowMs - D - 8 * 36e5);
  var ersterTag;
  var reach;
  if (!Object.keys(have).length || force === "voll") {
    have = {};
    var from = nowMs - 700 * D;
    reach = reichweite(from, nowMs);
    var tage0 = Object.keys(reach).sort();
    ersterTag = null;
    for (var i = 0; i < tage0.length; i++) { if (reach[tage0[i]] > 0) { ersterTag = tage0[i]; break; } }
    if (!ersterTag) throw new Error("Keine Instagram-Konto-Daten gefunden");
  } else {
    var back = utcTag(nowMs - 6 * D);
    ersterTag = back;
    reach = reichweite(tagMs(back), nowMs);
  }
  var tage = [];
  for (var ms = tagMs(ersterTag); utcTag(ms) <= letzterTag; ms += D) tage.push(utcTag(ms));
  var views = aufrufe(tage);
  tage.forEach(function (t) { have[t] = [views[t] || 0, reach[t] || 0]; });
  var rows = [["Datum", "Aufrufe", "Reichweite"]];
  Object.keys(have).sort().forEach(function (t) { rows.push([t, have[t][0], have[t][1]]); });
  sh.clearContents();
  sh.getRange(1, 1, rows.length, 1).setNumberFormat("@");
  sh.getRange(1, 1, rows.length, 3).setValues(rows);
  sh.setFrozenRows(1);
  props.setProperty("igVerlaufTag", heute);
  Logger.log("Instagram-Verlauf: " + (rows.length - 1) + " Tage, ab " + rows[1][0]);
}

// Holt Follower-Zugang und -Abgang des ganzen Instagram-Kontos pro Tag (seit Kontostart) in das Blatt "Instagram-Follower".
// Daraus rechnet der Hub die Follower rueckwirkend aus der heutigen Zahl zurueck. Laeuft einmal pro Tag, danach nur die letzten Tage.
function igFollowerVerlauf(force) {
  var props = PropertiesService.getScriptProperties();
  var token = props.getProperty("IG_TOKEN"), uid = props.getProperty("IG_USER_ID");
  if (!token || !uid) return;
  var tz = Session.getScriptTimeZone();
  var heute = Utilities.formatDate(new Date(), tz, "yyyy-MM-dd");
  if (!force && props.getProperty("igFolTag") === heute) return;
  var D = 864e5, nowMs = Date.now();
  var base = "https://graph.facebook.com/v22.0/" + uid + "/insights?access_token=" + token;
  function utcTag(ms) { return Utilities.formatDate(new Date(ms), "UTC", "yyyy-MM-dd"); }
  function tagMs(tag) { return Date.parse(tag + "T08:00:00Z"); }
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("Instagram-Follower") || ss.insertSheet("Instagram-Follower");
  var have = {};
  if (sh.getLastRow() > 1) {
    sh.getRange(2, 1, sh.getLastRow() - 1, 3).getValues().forEach(function (r) {
      var t = r[0] instanceof Date ? Utilities.formatDate(r[0], tz, "yyyy-MM-dd") : String(r[0]).slice(0, 10);
      if (t) have[t] = [Number(r[1]) || 0, Number(r[2]) || 0];
    });
  }
  var ersterTag;
  if (!Object.keys(have).length || force === "voll") {
    have = {};
    var v = ss.getSheetByName("Instagram-Verlauf");
    if (!v || v.getLastRow() < 2) throw new Error("Blatt Instagram-Verlauf fehlt");
    var a = v.getRange(2, 1).getValue();
    ersterTag = a instanceof Date ? Utilities.formatDate(a, tz, "yyyy-MM-dd") : String(a).slice(0, 10);
  } else {
    ersterTag = utcTag(nowMs - 6 * D);
  }
  var letzterTag = utcTag(nowMs - D - 8 * 36e5);
  var tage = [];
  for (var ms = tagMs(ersterTag); utcTag(ms) <= letzterTag; ms += D) tage.push(utcTag(ms));
  for (var i = 0; i < tage.length; i += 4) {
    var teil = tage.slice(i, i + 4);
    var reqs = teil.map(function (t) {
      var s = tagMs(t);
      return { url: base + "&metric=follows_and_unfollows&metric_type=total_value&breakdown=follow_type&period=day&since=" + Math.floor(s / 1000) + "&until=" + (Math.floor((s + D) / 1000) - 1), muteHttpExceptions: true };
    });
    var antw;
    try { antw = UrlFetchApp.fetchAll(reqs); }
    catch (e) { Utilities.sleep(8000); antw = UrlFetchApp.fetchAll(reqs); }
    antw.forEach(function (r, k) {
      var j = JSON.parse(r.getContentText());
      if (j.error) throw new Error("Instagram: " + j.error.message);
      var zu = 0, ab = 0;
      var d = j.data && j.data[0];
      var res = (d && d.total_value && d.total_value.breakdowns && d.total_value.breakdowns[0] && d.total_value.breakdowns[0].results) || [];
      res.forEach(function (x) {
        if (x.dimension_values[0] === "FOLLOWER") zu = Number(x.value) || 0;
        else ab = Number(x.value) || 0;
      });
      have[teil[k]] = [zu, ab];
    });
    Utilities.sleep(1200);
  }
  var rows = [["Datum", "Zugang", "Abgang"]];
  Object.keys(have).sort().forEach(function (t) { rows.push([t, have[t][0], have[t][1]]); });
  sh.clearContents();
  sh.getRange(1, 1, rows.length, 1).setNumberFormat("@");
  sh.getRange(1, 1, rows.length, 3).setValues(rows);
  sh.setFrozenRows(1);
  props.setProperty("igFolTag", heute);
  Logger.log("Instagram-Follower: " + (rows.length - 1) + " Tage, ab " + rows[1][0]);
}

// ---------- Twitch Live-Status (optional) ----------
// Liest nur oeffentliche Kanal-Infos (live oder nicht, Titel, Spiel, Zuschauer, Sendeplan) ueber die offizielle Twitch-Schnittstelle
// und schreibt sie in das Blatt "Twitch". Schluessel stehen nur in den Skripteigenschaften:
// TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET und optional TWITCH_LOGIN (Kanalname, Standard: gtasty). Nie im Code und nie im Hub.
function twitchToken() {
  var cache = CacheService.getScriptCache();
  var t = cache.get("twitchToken");
  if (t) return t;
  var props = PropertiesService.getScriptProperties();
  var r = UrlFetchApp.fetch("https://id.twitch.tv/oauth2/token", {
    method: "post", muteHttpExceptions: true,
    payload: {client_id: props.getProperty("TWITCH_CLIENT_ID"), client_secret: props.getProperty("TWITCH_CLIENT_SECRET"), grant_type: "client_credentials"}
  });
  var j = {};
  try { j = JSON.parse(r.getContentText()); } catch (e) {}
  if (r.getResponseCode() !== 200 || !j.access_token) {
    throw new Error("Twitch: " + (j.message || ("Fehler " + r.getResponseCode())) + " (Client-ID und Geheimnis in den Skripteigenschaften pruefen)");
  }
  cache.put("twitchToken", j.access_token, Math.max(60, Math.min(21000, (j.expires_in || 3600) - 300)));
  return j.access_token;
}

function twGet(path) {
  var r = UrlFetchApp.fetch("https://api.twitch.tv/helix/" + path, {
    headers: {"Client-Id": PropertiesService.getScriptProperties().getProperty("TWITCH_CLIENT_ID"), Authorization: "Bearer " + twitchToken()},
    muteHttpExceptions: true
  });
  var j = {};
  try { j = JSON.parse(r.getContentText()); } catch (e) {}
  if (r.getResponseCode() === 401) { CacheService.getScriptCache().remove("twitchToken"); }
  if (r.getResponseCode() !== 200) throw new Error("Twitch: " + (j.message || ("Fehler " + r.getResponseCode())));
  return j;
}

function twDauer(s) {
  var m = /(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/.exec(s || "");
  return ((+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0)) * 1000;
}

function syncTwitch() {
  var props = PropertiesService.getScriptProperties();
  if (!props.getProperty("TWITCH_CLIENT_ID") || !props.getProperty("TWITCH_CLIENT_SECRET")) return;
  var login = String(props.getProperty("TWITCH_LOGIN") || "gtasty").trim().toLowerCase();
  var u = twGet("users?login=" + encodeURIComponent(login)).data || [];
  if (!u.length) throw new Error("Twitch: Kanal " + login + " nicht gefunden");
  var id = u[0].id, name = u[0].display_name || login;
  var st = twGet("streams?user_id=" + id).data || [];
  var live = st.length > 0 && st[0].type === "live";
  var info = live ? st[0] : {};
  var last = props.getProperty("twLastLive") || "";
  if (live) {
    last = new Date().toISOString();
    props.setProperty("twLastLive", last);
  } else {
    try {
      var v = twGet("videos?user_id=" + id + "&type=archive&first=1").data || [];
      if (v.length) {
        var ende = new Date(Date.parse(v[0].created_at) + twDauer(v[0].duration)).toISOString();
        if (ende > last) { last = ende; props.setProperty("twLastLive", last); }
      }
    } catch (e) { Logger.log("Twitch-Videos: " + e); }
  }
  var next = "", nextTitle = "";
  try {
    var sc = twGet("schedule?broadcaster_id=" + id + "&first=10").data || {};
    var seg = sc.segments || [];
    for (var i = 0; i < seg.length; i++) {
      if (!seg[i].canceled_until && Date.parse(seg[i].start_time) > Date.now()) { next = seg[i].start_time; nextTitle = seg[i].title || ""; break; }
    }
  } catch (e) { Logger.log("Twitch-Sendeplan: " + e); }
  var rows = [["Schluessel", "Wert"],
    ["login", login], ["name", name], ["live", live ? "ja" : "nein"],
    ["titel", String(info.title || "")], ["spiel", String(info.game_name || "")], ["zuschauer", String(info.viewer_count || 0)],
    ["gestartet", String(info.started_at || "")], ["zuletzt_live", last], ["naechster_start", next], ["naechster_titel", nextTitle],
    ["abgefragt", new Date().toISOString()]];
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName("Twitch") || ss.insertSheet("Twitch");
  sh.clearContents();
  sh.getRange(1, 1, rows.length, 2).setNumberFormat("@");
  sh.getRange(1, 1, rows.length, 2).setValues(rows);
  sh.setFrozenRows(1);
}

// Einmal ausfuehren, nachdem TWITCH_CLIENT_ID und TWITCH_CLIENT_SECRET in den Skripteigenschaften stehen:
// legt den Lauf alle 5 Minuten an und holt sofort den ersten Status.
function twitchEinrichten() {
  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (t.getHandlerFunction() === "syncTwitch") ScriptApp.deleteTrigger(t);
  });
  ScriptApp.newTrigger("syncTwitch").timeBased().everyMinutes(5).create();
  syncTwitch();
}

// ---------- Clip-Finder (optional) ----------
// Schickt nur den TEXT eines Videos (nie das Video) an Gemini (kostenlose Stufe von Google AI Studio) und gibt die besten Stellen zurueck.
// Der Schluessel steht nur in den Skripteigenschaften (GEMINI_KEY), nie im Code und nie im Hub. Ohne richtigen Sync-Code laeuft nichts.
function clipsAnalyse(req) {
  var key = PropertiesService.getScriptProperties().getProperty("GEMINI_KEY");
  if (!key) return {ok: false, error: "GEMINI_KEY fehlt in den Skripteigenschaften. Den Gratis-Schluessel gibt es bei Google AI Studio."};
  var text = String(req.text || "");
  if (text.length < 300) return {ok: false, error: "Der Text ist zu kurz fuer eine Auswertung."};
  if (text.length > 300000) return {ok: false, error: "Der Text ist zu lang."};
  var kats = (req.kategorien || []).map(String).slice(0, 30);
  var prompt = "Du hilfst einem deutschen Creator, aus einem langen Video die besten Stellen fuer Kurzvideos (TikTok, Instagram Reels, YouTube Shorts) zu finden.\n\n"
    + "Unten steht das Transkript des Videos. Jede Zeile beginnt mit der Startzeit in Sekunden in eckigen Klammern.\n\n"
    + "Aufgabe: Waehle die 6 bis 12 besten Stellen. Gut sind: klare Meinungen und Streitthemen (zum Beispiel PC gegen Konsole), "
    + "lustige oder ueberraschende Momente, spannende Geschichten, starke Reaktionen und Aussagen, die auch ohne Vorwissen verstaendlich sind "
    + "(zum Beispiel Erklaerungen zu einer Aktie oder einem Thema).\n"
    + "Regeln:\n"
    + "- Jede Stelle ist 20 bis 75 Sekunden lang, bei starken Momenten bis 90 Sekunden.\n"
    + "- Der Start liegt am Anfang eines Satzes mit einem starken Einstieg, das Ende am Ende eines Satzes. Es soll eine in sich geschlossene Aussage oder Pointe sein.\n"
    + "- Stellen duerfen sich nicht ueberschneiden.\n"
    + "- Nutze nur Zeiten, die im Transkript vorkommen oder daraus ableitbar sind. Erfinde nichts.\n"
    + "- Schreibe auf Deutsch. Titel: kurz und neugierig machend, hoechstens 60 Zeichen, keine Anfuehrungszeichen.\n"
    + "- bewertung: Zahl von 1 bis 10, wie wahrscheinlich die Stelle als Short gut ankommt.\n"
    + "- kategorie: genau eine aus dieser Liste oder leer, wenn keine passt: " + JSON.stringify(kats) + "\n\n"
    + "Antworte NUR mit JSON in genau dieser Form:\n"
    + "{\"clips\":[{\"start\":123.4,\"ende\":171.0,\"titel\":\"...\",\"haken\":\"der erste Satz der Stelle\",\"grund\":\"ein Satz, warum die Stelle gut ist\",\"kategorie\":\"...\",\"bewertung\":8,\"beschreibung\":\"kurze Beschreibung fuer die Veroeffentlichung, 1 bis 2 Saetze\",\"tags\":[\"stichwort\"]}]}\n\n"
    + "Transkript:\n" + text;
  var models = ["gemini-3.5-flash", "gemini-3.1-flash-lite", "gemini-3.8-flash"];
  var started = new Date().getTime();
  var code = 0;
  var j = {};
  var tried = [];
  var fertig = false;
  for (var round = 0; round < 3 && !fertig; round++) {
    if (round > 0) {
      if (new Date().getTime() - started > 200000) break;
      Utilities.sleep(8000);
    }
    for (var mi = 0; mi < models.length && !fertig; mi++) {
      if (tried.length > 0 && new Date().getTime() - started > 240000) { fertig = true; break; }
      var cfgs = [
        {responseMimeType: "application/json", temperature: 0.4, thinkingConfig: {thinkingLevel: "minimal"}},
        {responseMimeType: "application/json", temperature: 0.4}
      ];
      for (var ci = 0; ci < cfgs.length; ci++) {
        var body = {contents: [{role: "user", parts: [{text: prompt}]}], generationConfig: cfgs[ci]};
        var r = UrlFetchApp.fetch("https://generativelanguage.googleapis.com/v1beta/models/" + models[mi] + ":generateContent", {
          method: "post", contentType: "application/json", headers: {"x-goog-api-key": key}, payload: JSON.stringify(body), muteHttpExceptions: true
        });
        code = r.getResponseCode();
        j = {};
        try { j = JSON.parse(r.getContentText()); } catch (e) {}
        tried.push(code);
        if (code !== 400) break;
        if (/API key/i.test((j.error && j.error.message) || "")) break;
      }
      if (code === 200 || code === 401 || code === 403) fertig = true;
      if (code === 400 && /API key/i.test((j.error && j.error.message) || "")) fertig = true;
    }
  }
  var hinweis = " (Antworten von Google: " + tried.join(", ") + ")";
  if (code === 429) return {ok: false, error: "Das kostenlose Limit von Gemini ist gerade erreicht. Bitte in ein bis zwei Minuten nochmal versuchen." + hinweis};
  if (code === 500 || code === 502 || code === 503 || code === 504 || code === 0) return {ok: false, error: "Gemini ist gerade ueberlastet (das liegt bei Google). Bitte in ein paar Minuten nochmal auf Beste Stellen neu suchen tippen." + hinweis};
  if (code === 400 || code === 401 || code === 403) return {ok: false, error: "Gemini hat die Anfrage nicht akzeptiert (" + code + "): " + ((j.error && j.error.message) || "")};
  if (code !== 200) return {ok: false, error: "Gemini-Fehler " + code + ((j.error && j.error.message) ? ": " + j.error.message : "")};
  var t = "";
  try { t = j.candidates[0].content.parts.map(function (p) { return p.text || ""; }).join(""); } catch (e) {}
  var data = null;
  try { data = JSON.parse(t); } catch (e) {
    var m = t.match(/\{[\s\S]*\}/);
    if (m) { try { data = JSON.parse(m[0]); } catch (e2) {} }
  }
  if (!data || !Array.isArray(data.clips)) return {ok: false, error: "Gemini hat keine brauchbare Antwort geliefert. Bitte nochmal versuchen."};
  return {ok: true, clips: data.clips.slice(0, 20)};
}

function doPost(e) {
  var lock = LockService.getScriptLock();
  try {
    var req = JSON.parse(e.postData.contents);
    var code = PropertiesService.getScriptProperties().getProperty("HUB_SYNC_CODE");
    if (!code || String(req.code || "") !== code) {
      Utilities.sleep(2000);
      return antwort({ok: false, error: "Sync-Code falsch oder noch nicht in den Skripteigenschaften (HUB_SYNC_CODE) eingetragen"});
    }
    if (req.action === "clips") return antwort(clipsAnalyse(req));
    lock.waitLock(25000);
    var f = hubDatei();
    var st = {};
    try { st = JSON.parse(f.getBlob().getDataAsString() || "{}"); } catch (x) {}
    if (!st.items) st.items = {};
    var now = Date.now(), max = 0, k;
    if (req.action === "put") {
      var neu = req.items || {};
      for (k in neu) { st.items[k] = {r: neu[k].r === undefined ? null : neu[k].r, t: now}; }
      f.setContent(JSON.stringify(st));
    }
    var since = Number(req.since) || 0, out = {};
    for (k in st.items) {
      var t = st.items[k].t;
      if (t > max) max = t;
      if (req.action !== "put" && t > since) out[k] = st.items[k];
    }
    return antwort({ok: true, items: out, max: max});
  } catch (err) {
    return antwort({ok: false, error: String(err)});
  } finally {
    try { lock.releaseLock(); } catch (y) {}
  }
}

<script>

let SAVET=null,SAVEWARN=false;

 try{await IDB.put(str);try{localStorage.removeItem(KEY)}catch(e){}SAVEWARN=false;return}catch(e){}

async function boot(){let a=null,b=null;

 return `<section class="panel" style="margin:14px 0"><h2>Wann sind deine Follower aktiv?</h2><p class="notice" style="margin:0 0 12px"><b>Nur ein Überblick.</b> Das zeigt, wann deine Follower oder Zuschauer in den Apps am meisten aktiv sind. Es ist keine Empfehlung, wann du posten sollst, und es sagt nicht, wann Videos viral gehen. Der Upload-Planer rechnet nur mit deinen eigenen Clips.</p><div class="chips" style="margin:6px 0 12px"><span class="muted" style="font-size:12px">Wochentag</span>${FA_DN.map((n,i)=>`<span class="chip ${dw===i?"on":""}" onclick="A.faDay(${i})">${n.slice(0,2)}${i===tdow?" (heute)":""}</span>`).join("")}</div><p class="notice" style="margin:0 0 12px">Die Balken gelten für den gewählten Wochentag, der höchste Balken ist rot. <b>Was die Zahlen bedeuten:</b> Instagram zählt deine <b>Follower</b> (insgesamt 3.638). TikTok und YouTube zählen aktive <b>Zuschauer</b>, das sind nicht nur deine Follower, auch Leute, die dir nicht folgen. Deshalb sind die Zahlen bei TikTok höher als deine Followerzahl. Die Plattformen geben das dem Hub nicht automatisch heraus. Trag von Zeit zu Zeit neue Diagramme ein, der Hub sammelt alle Eintragungen. Danach reicht es, alle paar Wochen kurz nachzuschauen.<br><b>So trägst du ein:</b> Wähle das Datum des Diagramms, dazu den Zeitraum, in dem die Balken fast so hoch sind wie der höchste („Aktiv von … bis“), und die höchste Stunde (in TikTok die blaue Säule, im Hub wird sie rot). Du kannst auch nur eines von beiden angeben. Die Apps zeigen die Zeit oft als „9p“ (= 21 Uhr) oder „0a“ (= 0 Uhr), die Auswahl zeigt beides. Gerechnet wird mit deiner Zeit, so wie die App sie anzeigt. Die Eintragungen werden zwischen PC und Handy abgeglichen.</p><div class="cards c3">${PFL.map(card).join("")}</div></section>`}
function pPlaner(){const cf=plCfg(),thr=plThrV(cf),D=plData(),PFL=PF?[PF]:PLS,A_=PFL.map(p=>plAn(p,D,thr)),tot=D.length,

 const tNote=`<section class="panel" style="margin:14px 0"><h2>Uhrzeit wird noch nicht erfasst</h2><p class="notice">Bisher speichert dein Skript nur das Datum der Veröffentlichung. Für die Auswertung nach Tageszeit muss es auch die Uhrzeit speichern. <b>Einmal nötig:</b> Gehe auf <a onclick="A.go('daten')">Daten &amp; Backup</a>, kopiere dort den Skript-Code, öffne dein Apps-Script-Projekt, ersetze den gesamten alten Code durch den neuen und klicke auf Speichern. Es ist nichts neu zu bereitstellen und keine Funktion auszuführen. Spätestens nach der nächsten Aktualisierung (15 Minuten) holt sich der Hub die Uhrzeiten aller Clips.</p></section>`;
 const head0=head("Auswertung","Upload-Planer","Zeigt, an welchen Tagen, zu welchen Zeiten und mit welchen Themen deine Clips bisher viral gingen. Alles wird aus deinen eigenen Clips gerechnet.")+pfSwitch();

 let body="";

   l.push(a.bestWin?`Beste Zeit: <b style="color:#fff">${PL_WIN[a.bestWin.i][0]}</b> ${PL_WIN[a.bestWin.i][1]} (${plPct(a.bestWin.st.rate)}, ${a.bestWin.st.n} Clips)`:a.useT?"Beste Zeit: noch zu wenig Daten":"Beste Zeit: Uhrzeit fehlt noch");

   <p class="notice" style="margin-top:10px">Tippe oben auf eine Plattform für die ganze Auswertung mit Wochentagen, Tageszeiten und Kategorien.</p>${allT?"":tNote}`;
 }else{

 }
 const rules=`<section class="panel" style="margin:14px 0"><h2>Kategorien und Regeln</h2><p class="notice" style="margin:0 0 10px">Ein Clip bekommt automatisch die erste Kategorie von oben, bei der ein Wort aus dem Titel zu den Stichwörtern passt (ganze Wörter, Hashtags zählen mit, <b>stern*</b> am Ende gilt für alle Wörter, die so anfangen). Was du von Hand einem Clip zuweist, geht immer vor. Stichwörter trennst du mit Komma.</p>

/* ============ Zeitrechner ============ */

const ztZ=x=>String(x).padStart(2,"0");

function ztB(){const fps=ZT.fps,sec=Number(String(ZT.sec).trim().replace(",","."));

5. In "grund" kurz benennen, warum die ersten 3 Sekunden stoppen lassen und ob die Stelle eher Zustimmung oder Widerspruch ausloest.

 <div><label class="f">Balkenfarbe</label><input class="in" id="pb-color" type="color" style="height:42px;padding:3px" value="${c.color}"></div><div><label class="f">Balkendicke (Pixel bei 1080p)</label><input class="in" id="pb-thickness" type="number" min="2" max="40" value="${c.thickness}"></div><div><label class="f">Bildrate deines CapCut-Projekts</label><select class="in" id="pb-pfps">${[60,30,50,25,24].map(f=>`<option value="${f}">${f} Bilder/s</option>`).join("")}</select></div>
 <div><label class="f">Videoformat</label><select class="in" id="pb-format"><option value="1080">Full HD – 1920 × 1080</option><option value="2160">4K – 3840 × 2160</option><option value="1920">Hochformat – 1080 × 1920</option></select></div>
 <div><label class="f">Aufnahme-Bildrate</label><select class="in" id="pb-fps"><option value="60">60 Bilder/s (genauer)</option><option value="30">30 Bilder/s</option></select></div>
 <div class="span2"><label class="f">Hintergrund</label><select class="in" id="pb-bg"><option value="transparent">Transparent (wenn unterstützt)</option><option value="green">Grün für Chroma Key</option></select></div></div><p class="notice"><b>CapCut zeigt Zeit als Sekunden:Bilder</b> (z. B. <b>35:22</b> = 35 Sekunden + 22 Bilder, <u>nicht</u> 35,22 Sekunden). Dann trage bei Sekunden <b>35</b> und bei Bilder <b>22</b> ein und wähle die Bildrate deines CapCut-Projekts. Wenn du dagegen eine Dauer in Sekunden kennst: <b>18,18 s</b> = Sekunden 18 + Millisekunden 180 (oder 18,18 bei Sekunden). 18 Millisekunden sind nur 0,018 s.</p></section>
 <section class="panel" style="margin-top:14px"><h2>2. Bewegung einstellen</h2><label class="f">Geschwindigkeit am Anfang (k): <b id="pb-easeV"></b></label><input id="pb-ease" type="range" min="1" max="4" step=".1" value="${c.ease}" style="width:100%;accent-color:#ffc400">
 <p class="notice">p(t) = 1 − (1 − t)<sup>k</sup>. 1× = gleichmäßig. Höher = schneller Start, langsamer zum Ende. 100 % wird erst genau am Ende erreicht.</p>
 <label class="f">Abstand zum linken/rechten Rand: <b id="pb-marginV"></b></label><input id="pb-margin" type="range" min="0" max="10" step=".5" value="${c.margin}" style="width:100%;accent-color:#ffc400"></section>
 <section class="panel" style="margin-top:14px"><h2>3. Vorschau &amp; Export</h2><div class="checker" id="pb-box"><canvas id="pb-canvas" style="width:100%;height:100%;display:block;object-fit:contain"></canvas></div>
 <p class="notice" id="pb-info"></p><p style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="pb-export">WebM exportieren</button><button class="btn gh" id="pb-play">Vorschau abspielen</button></p><div class="bar" id="pb-barw" style="display:none;margin-top:10px"><i id="pb-bar" style="width:0"></i></div><p class="ok" id="pb-status"></p></section>
 <section class="panel" style="margin-top:14px"><h2>In CapCut verwenden</h2><ol class="notice" style="font-size:13px"><li>WebM-Datei in CapCut importieren und auf eine Videospur über deinen Clip legen, am Anfang ausrichten.</li><li>Bei transparentem Export sollte dein Video darunter sichtbar sein.</li><li>Falls CapCut einen schwarzen oder weißen Hintergrund zeigt: erneut mit „Grün für Chroma Key“ exportieren, in CapCut <i>Chroma Key</i> auf das Overlay anwenden und Grün entfernen.</li></ol>
 <p class="notice"><b>Hinweis:</b> Transparente WebM-Dateien werden je nach Browser und CapCut-Version unterschiedlich erkannt. Die Chroma-Key-Variante ist die sichere Ausweichlösung. Der Export läuft in Echtzeit (90 s Clip ≈ 90 s Wartezeit). Die Millisekunden werden exakt in die Animation eingerechnet; die fertige Datei ist durch die Bildrate auf ein Bild genau (60 Bilder/s ≈ 17 ms, 30 Bilder/s ≈ 33 ms). Läuft der PC während des Exports am Limit (z. B. 4K), lieber 30 Bilder/s wählen und nichts anderes nebenbei öffnen. Wechselst du den Tab, wird der Export abgebrochen. Chrome oder Edge am PC verwenden. Einstellungen werden automatisch gespeichert.</p></section>`}

function vint(b,i){const f=b[i];let n=1,m=0x80;while(n<=8&&!(f&m)){n++;m>>=1}if(n>8)throw new Error("vint");let v=f&(m-1),all=(f&(m-1))===(m-1);for(let k=1;k<n;k++){v=v*256+b[i+k];if(b[i+k]!==255)all=false}return{len:n,val:v,unk:all}}
async function webmDuration(blob,ms){const b=new Uint8Array(await blob.arrayBuffer());let i=0;
 const id=()=>{const n=vint(b,i).len,x=b.slice(i,i+n);i+=n;return Array.from(x).map(y=>y.toString(16).padStart(2,"0")).join("")};
 if(id()!=="1a45dfa3")return blob;let r=vint(b,i);i+=r.len+r.val;
 if(id()!=="18538067")return blob;r=vint(b,i);if(!r.unk)return blob;i+=r.len;
 while(i<b.length){const st=i,nm=id();r=vint(b,i);const sl=r.len;i+=sl;
  if(nm==="1549a966"){const dEnd=i+r.val;let j=i,scale=1e6;
   while(j<dEnd){const q=vint(b,j),tag=Array.from(b.slice(j,j+q.len)).map(y=>y.toString(16).padStart(2,"0")).join("");j+=q.len;const z=vint(b,j);j+=z.len;if(tag==="4489")return blob;if(tag==="2ad7b1"){scale=0;for(let k=0;k<z.val;k++)scale=scale*256+b[j+k]}j+=z.val}
   const dur=new Uint8Array(11);dur[0]=0x44;dur[1]=0x89;dur[2]=0x88;new DataView(dur.buffer).setFloat64(3,ms*1e6/scale,false);
   const nl=r.val+11,sz=new Uint8Array(sl);let v=nl;for(let k=sl-1;k>=0;k--){sz[k]=v%256;v=Math.floor(v/256)}sz[0]|=(0x80>>(sl-1));if(nl>=Math.pow(2,7*sl)-1)return blob;
   const out=new Uint8Array(b.length+11);out.set(b.slice(0,st+(nm.length/2)),0);out.set(sz,st+nm.length/2);out.set(b.slice(i,dEnd),st+nm.length/2+sl);out.set(dur,dEnd-i+st+nm.length/2+sl);out.set(b.slice(dEnd),dEnd+11);return new Blob([out],{type:"video/webm"})}
  i+=r.val}
 return blob}
function pbInit(){const $=id=>document.getElementById(id),cv=$("pb-canvas");
 $("pb-format").value=db.pb.format;$("pb-bg").value=db.pb.bg;$("pb-fps").value=db.pb.fps===30?"30":"60";$("pb-pfps").value=String([60,30,50,25,24].includes(db.pb.pfps)?db.pb.pfps:60);
 const secV=()=>{const x=Number(String($("pb-seconds").value).trim().replace(",","."));return isFinite(x)?clampN(x,0,59.999):0};
 const pfpsV=()=>Number($("pb-pfps").value)||60;
 const cfg0=()=>({totalExact:Math.max(1,(clampN(Math.floor(Number($("pb-minutes").value))||0,0,999)*60+secV())*1000+clampN(Math.floor(Number($("pb-ms").value))||0,0,999)+clampN(Math.floor(Number($("pb-frames").value))||0,0,999)*1000/pfpsV()),pf:pfpsV(),color:/^#[0-9a-f]{6}$/i.test($("pb-color").value)?$("pb-color").value:"#22c55e",thickness:clampN(Number($("pb-thickness").value)||9,2,40),format:$("pb-format").value,fps:$("pb-fps").value==="30"?30:60,bg:$("pb-bg").value,ease:clampN(Number($("pb-ease").value)||1,1,4),margin:clampN(Number($("pb-margin").value)||0,0,10)}),fmtD=ms=>Math.floor(ms/60000)+":"+String(Math.floor(ms/1000)%60).padStart(2,"0")+"."+String(ms%1000).padStart(3,"0");
 const cfg=()=>{const c=cfg0();c.totalMs=Math.round(c.totalExact);c.duration=c.totalExact/1000;return c};
 const capT=c=>{const n=Math.round(c.totalExact*c.pf/1000),t=Math.floor(n/c.pf),z=x=>String(x).padStart(2,"0");return z(Math.floor(t/3600))+":"+z(Math.floor(t/60)%60)+":"+z(t%60)+":"+z(n%c.pf)};
 const draw=(ctx,p,c)=>{const{w,h}=pbDims(c.format),x=w*c.margin/100,tr=w-2*x,y=h-h*.045,t=Math.max(2,c.thickness*h/1080);ctx.clearRect(0,0,w,h);if(c.bg==="green"){ctx.fillStyle="#00ff00";ctx.fillRect(0,0,w,h)}ctx.fillStyle=c.color;const ww=Math.max(t,tr*p);ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y-t/2,ww,t,t/2);else ctx.rect(x,y-t/2,ww,t);ctx.fill()};

 $("pb-play").onclick=()=>{if(pbBusy)return;if(pbRAF)cancelAnimationFrame(pbRAF);const c=cfg(),st=performance.now(),ctx=cv.getContext("2d");const f=n=>{const t=Math.min(1,(n-st)/(c.duration*1000));draw(ctx,pbEase(t,c.ease),c);pbRAF=t<1?requestAnimationFrame(f):null};pbRAF=requestAnimationFrame(f)};

  rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());document.removeEventListener("visibilitychange",onHide);pbBusy=false;$("pb-export").disabled=false;$("pb-play").disabled=false;$("pb-barw")&&($("pb-barw").style.display="none");
   if(abort){st.textContent="Export abgebrochen: Der Tab war im Hintergrund, das Video wäre zu kurz oder ruckelig geworden. Bitte erneut starten und den Tab offen lassen.";return}
   let blob=new Blob(chunks,{type:"video/webm"});try{blob=await webmDuration(blob,c.totalExact-0.25)}catch(e){}const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`progress-bar-${fmtD(c.totalMs).replace(":","m").replace(".","s")}ms-${c.format==="1920"?"hochformat":c.format==="2160"?"4k":"fullhd"}${c.bg==="green"?"-chromakey":""}.webm`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5e3);st.textContent=`Export fertig (${fmtD(c.totalMs)}). Datei wurde heruntergeladen.`};
  pbBusy=true;$("pb-export").disabled=true;$("pb-play").disabled=true;$("pb-barw").style.display="block";st.textContent="Export läuft in Echtzeit – bitte diesen Tab offen und im Vordergrund lassen …";

   if(t<1)requestAnimationFrame(f);else{draw(ctx,1,c);setTimeout(()=>{if(rec.state!=="inactive")rec.stop()},250)}};requestAnimationFrame(f)}}
